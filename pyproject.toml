[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "vmim21cm"
version = "1.0.0"
description = "Information-maximising (VMIM) compression of 21-cm data for simulation-based inference"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "nflows>=0.14",
    "numpy>=1.24",
    "scikit-learn>=1.2",
    "PyYAML>=6.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
vmim21cm = "vmim21cm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: end-to-end pipeline runs (minutes on CPU)"]
