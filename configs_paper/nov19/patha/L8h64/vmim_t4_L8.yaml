# NSF-DEPTH TEST 2 (2026-11-17), Path A k=4 pure VMIM (paper pureVMIM3 mix2), stage 1 NOT rerun.
# {arm}/summaries = symlink to mlp_paper_pureVMIM3/vmim_t4_mix2_s<C>/summaries.
# ONLY nle.n_layers=8, nle.hidden=64 changed (paper 4 / 64). Paper SBC set. Stages 2+3, c43n42 + c44n42: configs_paper/nsfdepth2/submit_nsfdepth2.sh
#   python make_sbc_list.py configs_paper/nsfdepth2/vmim_t4_L8.yaml --seed.compressor 43,44 --seed.nle 42 --families nsf --label "path A k4 L8" --out configs_paper/nsfdepth2/vmim_t4_L8.list
arm_name: mlp_paper_nsfdepth2/vmim_t4_L8       # <<<
arm_type: mlp
scratch_root: /gscratch/ddehiwalage-don/sbi
n_params: 4
t_dim: 4                          # <<<

data:
  summaries_npz: /gscratch/ddehiwalage-don/sbi_runs/BASELINE/baseline_pdf_ps/baseline_pdf_ps_Nnoise1000.npz

compressor:
  vmim_head: gmm_old
  n_mix_head: 2             # <<< was 4
  hidden_head: 64
  head_lr_mult: 5.0
  dense_layers: [256, 256, 128, 64]
  dropout: 0.0
  warmup_epochs: 0          # PURE VMIM from epoch 0: no MSE warm-up (aux MSE weight 0 every epoch)
  sigma_floor: 1.0e-2
  epochs: 400
  plateau_patience: 15      # ReduceLROnPlateau
  probe_every: 5            # RF-R2 / q-sigma probes: logged only
  probe_patience: 100000    # early stop OFF -> every run trains the full budget
  batch_size: 32
  save_batch_size: 4096
  lr: 2.0e-4
  seed: 43                  # split seed; --seed.compressor sets init_seed only
  tag_arm_with_seed: true
  val_frac: 0.1

nle:
  model: gmm                # placeholder; submit_mlp_grid.sh overrides with -o nle.model=...
  nsplit: 10
  batch_size: 32
  lr_phase1: 2.0e-4
  lr_phase2: 2.0e-5
  num_workers: 2
  val_frac: 0.1
  seed: 42
  n_mix: 2
  param_style: softplus
  diag_floor: 1.0e-4
  hidden: 64                # <<< paper 64
  n_layers: 8                # <<< paper 4
  num_bins: 8
  tail_bound: 5.0

mcmc:
  wedge_tau_idx: 1
  wedge_mmin_idx: 3
